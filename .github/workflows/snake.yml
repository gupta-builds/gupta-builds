name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?year=2026&color_snake=7c3aed&color_dots[0]=eaeaea&color_dots[1]=d8b4fe&color_dots[2]=a78bfa&color_dots[3]=7c3aed&color_dots[4]=5b21b6
            dist/github-contribution-grid-snake-dark.svg?year=2026&color_bg=0d1117&color_snake=c084fc&color_dots[0]=21262d&color_dots[1]=1e0a3c&color_dots[2]=4c1d95&color_dots[3]=7c3aed&color_dots[4]=a78bfa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
